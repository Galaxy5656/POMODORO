<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navSect">
        <div class="title">
            <h1>The Pomodoro Technique</h1>
            <h2>by Ethan</h2>
        </div>
        <input autocapitalize="on" placeholder="What are you working on?">
    </div>
    <div class="pomodoroSect">
        <div id="po" class="pomodoro">PO</div>
        <div id="mo" class="pomodoro">MO</div>
        <div id="do" class="pomodoro">DO</div>
        <div id="ro" class="pomodoro">RO</div>
    </div>
    <button id="start">START!</button>
    <div class="timerSect">
            <p class="timer" id="timer1"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
